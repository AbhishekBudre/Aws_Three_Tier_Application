name: this for the bulding pushing images at dockerhub backend

on:
  push:
    branches:
      - main
    
jobs:
  publish_images:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build backend -t ${{ secrets.DOCKER_HUB_USERNAME }}/devops-docker-project-backend:dev

      - name: Push images to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_TOKEN }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/devops-docker-project-backend:dev